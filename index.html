<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thajsko · Milan &amp; Terka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#FBFAF7;
  --ink:#1B1F22; --muted:#6C737A; --line:#E3E1D9; --line2:#EFEDE7;
  --north:#2E6B4E; --city:#6B4F7C; --sea:#0F7489; --krabi:#BC6236; --air:#59646E;
  --ok:#2E6B4E; --wait:#B07A12; --todo:#B0B6BB; --late:#B4402B;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#121416; --surface:#1A1D20; --surface2:#16191B;
    --ink:#ECEAE4; --muted:#99A0A7; --line:#2C3035; --line2:#24282C;
    --north:#5FA37F; --city:#A989BC; --sea:#4FAFC4; --krabi:#DD9163; --air:#909BA5;
    --ok:#5FA37F; --wait:#D9AB4A; --todo:#5A6168; --late:#E5826C;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px);
}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea); outline-offset:2px}
.wrap{max-width:720px; margin:0 auto; padding:0 16px 72px}

/* header */
header{padding:22px 0 12px}
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
h1{font-size:25px; line-height:1.12; letter-spacing:-.022em; font-weight:700; margin:0}
h1 .sub{display:block; font-weight:400; font-size:14px; color:var(--muted); letter-spacing:0; margin-top:5px}
.bar{height:9px; border-radius:5px; overflow:hidden; display:flex; background:var(--line2); border:1px solid var(--line); margin-top:14px}
.bar i{display:block; height:100%}
.bar .s2{background:var(--ok)} .bar .s1{background:var(--wait)} .bar .s0{background:var(--todo)}
.meterRow{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:7px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.meterRow b{color:var(--ink); font-weight:600}
.next{display:block; width:100%; text-align:left; border:none; background:none; padding:4px 0 0; font-size:12.5px; color:var(--muted)}
.next[hidden],.btn[hidden]{display:none}
.next b{color:var(--ink); font-weight:600}
.next .late{color:var(--late)} .next .soon{color:var(--wait)}

/* tabs */
nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:6px 0 10px}
.tabs{display:flex; gap:4px; background:var(--surface2); border:1px solid var(--line); border-radius:11px; padding:3px}
.tabs button{flex:1; border:none; background:transparent; color:var(--muted); font-size:13.5px; font-weight:500; padding:9px 2px; border-radius:8px; white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06)}
section[hidden]{display:none}

/* plan */
.leg{display:flex; align-items:center; gap:8px; margin:22px 0 8px; font-size:12.5px; color:var(--muted)}
.leg:first-child{margin-top:10px}
.leg .dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--c)}
.leg b{color:var(--ink); font-weight:600; font-size:14px}
.leg .fill{flex:1; height:1px; background:var(--line); min-width:8px}
.pill{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:500; color:var(--ink); max-width:100%}
.pill svg{width:13px; height:13px; flex:none; color:var(--wait)}
.pill i{width:8px; height:8px; border-radius:50%; flex:none; border:1.5px solid var(--todo)}
.pill[data-s="1"] i{border-color:var(--wait); background:var(--wait)}
.pill[data-s="2"] i{border-color:var(--ok); background:var(--ok)}
.pill[data-s="2"]{color:var(--muted)}
.pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stay{margin:0 0 8px}
.day{display:grid; grid-template-columns:52px 1fr; gap:11px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--c); border-radius:10px; padding:11px 8px 11px 10px; margin-bottom:7px}
.day.past{opacity:.55}
.day.today{box-shadow:0 0 0 2px var(--c)}
.dt{font-size:16px; font-weight:700; letter-spacing:-.02em; line-height:1.15}
.dt small{display:block; font-size:11.5px; font-weight:500; color:var(--muted); letter-spacing:.01em; margin-top:1px}
.dayHead{display:flex; align-items:flex-start; gap:6px}
.place{flex:1; font-weight:600; font-size:15px; margin:0 0 3px; letter-spacing:-.01em}
.tag{display:inline-block; font-size:11px; font-weight:600; padding:1px 6px; border-radius:5px; vertical-align:1px; margin-left:5px;
  background:color-mix(in srgb,var(--wait) 20%,transparent); color:var(--wait)}
.edit{flex:none; border:none; background:none; color:var(--muted); width:30px; height:26px; margin:-3px 0 0; padding:0; border-radius:7px; opacity:.6}
.edit svg{width:14px; height:14px}
.lines{margin:0; padding:0; list-style:none}
.lines li{display:flex; gap:8px; font-size:13.5px; padding:1.5px 0}
.lines .t{flex:none; width:4.6em; color:var(--muted); font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}

/* lists */
.grp{margin-top:18px}
.grpHead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; font-weight:600; color:var(--muted); padding:0 2px 6px}
.grpHead em{font-style:normal; color:var(--ink)}
.grpHead .late{color:var(--late)}
.rows{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.row{display:grid; grid-template-columns:28px 1fr auto auto; gap:6px; align-items:start; padding:7px 11px 7px 7px; border-top:1px solid var(--line2)}
.row:first-child{border-top:none}
.st{border:none; background:none; padding:0; width:28px; height:28px; display:grid; place-items:center; position:relative; flex:none}
.st::before{content:""; width:17px; height:17px; border-radius:50%; border:2px solid var(--todo)}
.st[data-s="1"]::before{border-color:var(--wait); background:linear-gradient(90deg,var(--wait) 50%,transparent 50%)}
.st[data-s="2"]::before{border-color:var(--ok); background:var(--ok)}
.st[data-s="2"]::after{content:""; position:absolute; width:8px; height:4px; border:2px solid var(--surface); border-top:none; border-right:none; transform:rotate(-45deg) translate(1px,-1px)}
.st.none::before{border-style:dashed}
.nm{border:none; background:none; padding:4px 0; width:100%; text-align:left; font-size:14px; font-weight:500; line-height:1.3; min-width:0}
.nm small{display:block; font-weight:400; font-size:12px; color:var(--muted); margin-top:2px}
.row[data-s="2"] .nm{color:var(--muted)}
.lnk{width:28px; height:28px; display:grid; place-items:center; border-radius:7px; color:var(--sea); text-decoration:none; font-size:15px}
.amt,.when{text-align:right; font-size:14px; white-space:nowrap; padding-top:4px}
.amt small,.when small{display:block; font-size:11px; color:var(--muted); margin-top:2px; font-weight:400}
.when{font-weight:600}
.when.late,.when.late small{color:var(--late)}
.when.soon{color:var(--wait)}
.amt.s2{color:var(--ok); font-weight:600} .amt.s1{color:var(--wait); font-weight:600}
.add{display:block; width:100%; margin-top:8px; border:1px dashed var(--line); background:transparent; color:var(--muted); border-radius:10px; padding:10px; font-size:13px; font-weight:500}
details.fold{margin-top:18px}
details.fold>summary{list-style:none; display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; font-weight:600; color:var(--muted); padding:6px 2px; cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span::before{content:"▸"; display:inline-block; width:1.1em}
details.fold[open]>summary span::before{content:"▾"}
details.fold>summary em{font-style:normal; color:var(--ink)}
.empty{padding:14px 12px; font-size:13.5px; color:var(--muted)}
.amt .tag{margin:0}
.sh label.chk{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:500; color:var(--ink); margin-top:14px}
.sh label.chk input{width:18px; height:18px; margin:0; padding:0; flex:none}
.inl{border:none; background:transparent; border-bottom:1px dashed var(--line); padding:0 1px; width:4.2em; text-align:right; font-size:inherit}
.conv{margin-top:18px; font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline}
.conv b{color:var(--ink)}

/* sheet */
dialog{border:none; padding:0; background:var(--surface); color:var(--ink); width:min(560px,100%); max-width:100%; max-height:90dvh;
  margin:auto auto 0; border-radius:16px 16px 0 0; overflow:auto; box-shadow:0 -8px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(0,0,0,.42)}
@media (min-width:620px){ dialog{margin:auto; border-radius:14px} }
.sh{padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.shHead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
.kick{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.02em}
.x{border:none; background:var(--surface2); width:34px; height:34px; border-radius:50%; font-size:14px; color:var(--muted)}
.sh h2{font-size:19px; letter-spacing:-.015em; margin:0 0 10px}
.sh h3{font-size:12.5px; font-weight:600; color:var(--muted); margin:18px 0 6px}
.sh label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:11px}
.sh input,.sh textarea,.sh select{display:block; width:100%; min-width:0; margin-top:4px; border:1px solid var(--line); background:var(--surface2); border-radius:9px; padding:9px 10px; font-size:16px; font-weight:400; color:var(--ink)}
.sh textarea{min-height:76px; resize:vertical; line-height:1.4}
.sh input.title{font-size:19px; font-weight:600; letter-spacing:-.015em; border-color:transparent; background:transparent; padding:4px 0; margin:0 0 8px; border-bottom:1px dashed var(--line); border-radius:0}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.seg{display:flex; gap:4px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:3px}
.seg button{flex:1; border:none; background:transparent; border-radius:7px; padding:8px 4px; font-size:13px; font-weight:500; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); border-radius:9px; padding:9px 14px; font-size:13.5px; font-weight:600; text-decoration:none}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.danger{color:var(--late); background:transparent}
.btn.ghost{background:transparent; color:var(--muted)}
.btnRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.shFoot{display:flex; justify-content:space-between; gap:8px; margin-top:18px}
.tips{margin:0; padding:0 0 0 18px}
.tips li{font-size:14.5px; padding:4px 0; line-height:1.45}
.tip{border:1px solid var(--line); background:var(--surface2); border-radius:10px; padding:11px 8px 11px 12px; margin-bottom:8px}
.tipHead{display:flex; align-items:flex-start; gap:6px}
.tip h4{flex:1; margin:0 0 2px; font-size:15px; font-weight:600; letter-spacing:-.01em}
.tip .meta{font-size:12px; color:var(--muted); margin-bottom:6px}
.tip p{margin:0 0 6px; font-size:14px; line-height:1.45}
.tip .why{font-size:13px; color:var(--muted); line-height:1.45}
.tip a{display:inline-block; margin-top:7px; color:var(--sea); text-decoration:none; font-size:13px; font-weight:600}
.note{font-size:12.5px; color:var(--muted); line-height:1.5; margin:8px 0 0}
.note.warn{color:var(--wait)} .note.err{color:var(--late)} .note.ok{color:var(--ok)}

.foot{margin-top:26px; padding-top:12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.foot button{border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:11.5px; padding:5px 10px; border-radius:7px}
#toast{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:9; max-width:calc(100% - 32px);
  background:var(--late); color:#fff; font-size:13px; font-weight:500; padding:9px 14px; border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
@media (max-width:420px){
  .day{grid-template-columns:46px 1fr; gap:9px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none; animation:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="top">
    <h1>Thajsko<span class="sub" id="sub">3. – 20. február 2027 · Milan &amp; Terka</span></h1>
  </div>
  <div class="bar" id="prog" role="img"><i class="s2"></i><i class="s1"></i><i class="s0"></i></div>
  <div class="meterRow"><div id="progTxt"></div><div id="countdown"></div></div>
  <button class="next" id="next" type="button"></button>
</header>

<nav>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-todo" aria-controls="p-todo" aria-selected="true" type="button">Zostáva</button>
    <button role="tab" id="t-plan" aria-controls="p-plan" aria-selected="false" type="button">Plán</button>
    <button role="tab" id="t-money" aria-controls="p-money" aria-selected="false" type="button">Peniaze</button>
    <button role="tab" id="t-pack" aria-controls="p-pack" aria-selected="false" type="button">Balenie</button>
  </div>
</nav>

<section id="p-todo" role="tabpanel" aria-labelledby="t-todo"></section>
<section id="p-plan" role="tabpanel" aria-labelledby="t-plan" hidden></section>
<section id="p-money" role="tabpanel" aria-labelledby="t-money" hidden>
  <div class="bar" id="mBar" role="img" aria-label="Čerpanie rozpočtu"><i class="s2"></i><i class="s1"></i><i class="s0"></i></div>
  <div class="meterRow">
    <div><b id="fc">—</b> odhad · <b id="rz">—</b> rezerva</div>
    <div>rozpočet <input class="inl" id="budget" inputmode="numeric" aria-label="Rozpočet v eurách"> €</div>
  </div>
  <div class="meterRow" style="margin-top:3px"><div id="legend"></div></div>
  <div id="mGroups"></div>
  <div class="conv">
    <span><input class="inl" id="thb" inputmode="decimal" placeholder="1000" aria-label="Suma v THB"> THB = <b id="thbOut">—</b></span>
    <span>kurz 1 € = <input class="inl" id="rate" inputmode="decimal" style="width:3em" aria-label="Kurz THB za euro"> THB</span>
  </div>
</section>

<section id="p-pack" role="tabpanel" aria-labelledby="t-pack" hidden></section>

<div class="foot"><span id="sync"></span><button type="button" id="link"></button></div>
</div>

<dialog id="sheet"></dialog>
<div id="toast" role="status" hidden></div>
<noscript><p style="padding:16px">Plánovač potrebuje zapnutý JavaScript.</p></noscript>

<script>
"use strict";
/* ================= CONTENT (defaults — everything is editable in the app) ================= */
const TRIP = {from:"2027-02-03", to:"2027-02-20"};
const GROUPS = ["Vybaviť","Doprava","Ubytovanie","Aktivity","Na mieste"];
const maps = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);

const ITEMS = [
 {id:"v1", g:"Vybaviť", n:"Očkovanie — prvá dávka", st:2},
 {id:"v2", g:"Vybaviť", n:"Očkovanie — druhá dávka", due:"2026-12-15", note:"Termín: do polovice decembra."},

 {id:"v11",g:"Vybaviť", n:"Cestovné poistenie pre oboch", s:"s krytím turistiky a skútra", due:"2027-01-25", note:"Na 3.–20. 2. 2027. Skontrolovať krytie jazdy na skútri (vyžaduje vodičák kategórie A), túr a vodných aktivít."},

 {id:"v14",g:"Vybaviť", n:"Hotovosť 25–30 tis. THB", s:"vybrať po prílete", due:"2027-02-04", note:"Vyberať po veľkých dávkach, poplatok ~220 THB za výber."},

 {id:"f0", g:"Doprava", n:"Praha ⇄ Bangkok · Turkish", s:"3. a 20. 2. · mimo rozpočtu", st:2, off:true, day:"2027-02-03", k:"letenky", u:"https://www.turkishairlines.com/", note:"TK1772 + TK52 tam, TK65 + TK1769 späť. Batožina 30 kg + 8 kg kabínová. Refund nie je možný, úseky sa musia použiť v poradí."},
 {id:"f1", g:"Doprava", n:"Bangkok → Chiang Rai · Thai", s:"4. 2. · 16:50 → 18:20", est:122, st:2, day:"2027-02-04", k:"let"},

 {id:"b2", g:"Doprava", n:"Lomprayah Surat Thani → Koh Phangan", s:"11. 2. · 12:30 → 16:30", est:52, due:"2027-01-14", day:"2027-02-11", k:"Lomprayah", u:"https://12go.asia/en/travel/surat-thani-airport/koh-phangan?date=2027-02-11", note:"Kúpiť 3–4 týždne vopred. Nevratné, jedna zmena najneskôr 2 dni vopred."},
 {id:"b1", g:"Doprava", n:"Greenbus Chiang Rai → Chiang Mai", s:"6. 2. · terminál 1 → Arcade, VIP", est:22, due:"2027-02-01", day:"2027-02-06", k:"Greenbus", u:"https://www.greenbusthailand.com/website/", note:"6. 2. je čínsky Nový rok — kúpiť online pár dní vopred, overiť terminál na lístku."},

/* ================= STATE ================= */
const LS="thajsko-v2", K_META="thajsko-v2-sync", K_TOK="thajsko-gh-token";
const DEF = () => ({v:2, budget:3500, rate:37, it:{}, add:[], del:[], days:{}, tips:{}, tip:{}, tipAdd:[], tipDel:[]});
const isObj = o => !!o && typeof o==="object" && !Array.isArray(o);
function norm(o){
  const d=DEF();
  if(!isObj(o) || o.v!==2) return d;
  d.budget = num(o.budget)||0;
  d.rate = num(o.rate)>0 ? num(o.rate) : 37;
  if(isObj(o.it)) d.it=o.it;
  if(Array.isArray(o.add)) d.add=o.add.filter(x=>isObj(x) && x.id);
  if(Array.isArray(o.del)) d.del=o.del.map(String);
  if(isObj(o.days)) d.days=o.days;
  if(isObj(o.tips)) d.tips=o.tips;
  if(isObj(o.tip)) d.tip=o.tip;
  if(Array.isArray(o.tipAdd)) d.tipAdd=o.tipAdd.filter(x=>isObj(x) && x.id);
  if(Array.isArray(o.tipDel)) d.tipDel=o.tipDel.map(String);
  return d;
}
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function readJSON(k){ try{ return JSON.parse(ls(k)||"null"); }catch(e){ return null; } }

let S = norm(readJSON(LS));
// sha + base = the shared version this browser last saw; dirty = local changes not in it yet
let M = (m => ({sha:m.sha||null, base:isObj(m.base)?m.base:null, dirty:!!m.dirty}))(readJSON(K_META)||{});
function persist(){ ls(LS, JSON.stringify(S)); ls(K_META, JSON.stringify(M)); }
function touch(){ rev++; M.dirty=true; persist(); markSync(); schedule(); }

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function num(v){ if(v===null||v===undefined||v==="") return 0; const n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:0; }
const eur = n => Math.round(n).toLocaleString("sk-SK")+" €";
function normUrl(v){
  v=String(v||"").trim(); if(!v) return "";
  if(/^(https?:\/\/|mailto:|tel:)/i.test(v)) return v;
  if(/^[a-z][a-z0-9+.-]*:/i.test(v)) return "";
  return "https://"+v;
}
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");
const D = iso => { const a=iso.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); };
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
const diff = iso => Math.round((D(iso)-today())/864e5);
const short = iso => { const d=D(iso); return d.getDate()+". "+(d.getMonth()+1)+"."; };
const pl = (n,a,b,c) => n===1 ? a : (n>=2 && n<=4 ? b : c);
function rel(n){
  if(n===0) return "dnes"; if(n===1) return "zajtra"; if(n===-1) return "včera";
  const a=Math.abs(n);
  return n>0 ? "o "+a+" "+pl(a,"deň","dni","dní") : "pred "+a+" dňami";
}
const WD=["nedeľa","pondelok","utorok","streda","štvrtok","piatok","sobota"];
const LBL=["nezariadené","rezervované, čaká na platbu","hotovo"];
const LBL_PACK=["nezbalené","kúpené, ešte nezbalené","zbalené"];
const lbl = i => i.pack ? (i.buy && i.st===0 ? "treba kúpiť" : LBL_PACK[i.st]) : LBL[i.st];
const threeState = i => i.pack ? !!i.buy : num(i.est)>0;
const ICON_BULB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>';
const ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>';

/* ---- items ---- */
function items(){
  const base = ITEMS.concat(PACK).filter(i=>!S.del.includes(i.id)).map(i=>Object.assign({st:0}, i, S.it[i.id]));
  const own = S.add.map(i=>Object.assign({st:0}, i, {custom:true, bud:i.g==="Na mieste"}));
  return base.concat(own).map(i=>{ i.st = i.st===1||i.st===2 ? i.st : 0; if(!i.pack && !GROUPS.includes(i.g)) i.g="Vybaviť"; return i; });
}
const item = id => items().find(i=>i.id===id);
function patch(id,p){
  const c=S.add.find(x=>x.id===id);
  if(c) Object.assign(c,p); else S.it[id]=Object.assign({}, S.it[id], p);
  touch();
}
const hasPaid = i => i.paid!==null && i.paid!==undefined && i.paid!=="";
function eff(i){
  if(i.off) return 0;
  if(i.bud) return Math.max(num(i.est), num(i.paid));
  return hasPaid(i) ? num(i.paid) : num(i.est);
}
const byDue = (a,b) => (a.due||"9999").localeCompare(b.due||"9999");
function totals(){
  const t={paid:0, wait:0, total:0, n:0, n1:0, n2:0};
  items().forEach(i=>{
    if(i.pack) return;
    const e=eff(i); t.total+=e;
    if(i.bud){ t.paid+=num(i.paid); return; }
    t.n++;
    if(i.st===2){ t.paid+=e; t.n2++; } else if(i.st===1){ t.wait+=e; t.n1++; }
  });
  t.rest=Math.max(0, t.total-t.paid-t.wait);
  return t;
}

/* ================= RENDER ================= */
function circle(i){
  return '<button class="st" type="button" data-cyc="'+esc(i.id)+'" data-s="'+i.st+'" aria-label="'+esc(i.n)+' — '+lbl(i)+'. Zmeniť stav"></button>';
}
function linkOf(i){
  const u=normUrl(i.u);
  return u ? '<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener" aria-label="Otvoriť odkaz — '+esc(i.n)+'">↗</a>' : '<span></span>';
}
function row(i, mode){
  let right="", sub=i.s||"";
  if(mode==="todo"){
    if(num(i.est)>0) sub += (sub?" · ":"")+eur(eff(i));
    if(isISO(i.due)){ const n=diff(i.due); right='<div class="when'+(n<0?" late":n<=14?" soon":"")+'">'+short(i.due)+'<small>'+rel(n)+'</small></div>'; }
    else right='<div class="when"><small>bez termínu</small></div>';
  } else if(mode==="money"){
    const small = i.bud ? (num(i.paid)>0 ? "minuté "+eur(num(i.paid)) : "")
      : i.st===1 ? "čaká na platbu" : i.st===0 && isISO(i.due) ? "do "+short(i.due) : "";
    right='<div class="amt'+(i.bud?"":" s"+i.st)+'">'+(i.off?"—":eur(eff(i)))+(small?'<small>'+small+'</small>':'')+'</div>';
  } else if(mode==="pack" || mode==="buy"){
    if(mode==="buy") sub = PACK_WHO.find(w=>w[0]===i.who)[1]+(sub?" · "+sub:"");
    right = i.buy && i.st===0 ? '<div class="amt"><span class="tag">kúpiť</span></div>' : i.st===1 ? '<div class="amt"><small>mám, nezbalené</small></div>' : '<div></div>';
  } else {
    right = num(i.est)>0 && !i.off ? '<div class="amt s'+i.st+'">'+eur(eff(i))+'</div>' : '<div></div>';
  }
  return '<div class="row" data-s="'+i.st+'">'
    + (i.bud ? '<span class="st none" aria-hidden="true"></span>' : circle(i))
    + '<button class="nm" type="button" data-open="'+esc(i.id)+'">'+esc(i.n||"(bez názvu)")+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>'
    + linkOf(i) + right + '</div>';
}

function renderTop(){
  const t=totals(), n=Math.max(1,t.n);
  const bar=$("#prog").children;
  bar[0].style.width=(t.n2/n*100)+"%"; bar[1].style.width=(t.n1/n*100)+"%"; bar[2].style.width=0;
  $("#prog").setAttribute("aria-label","Vybavené "+t.n2+" z "+t.n);
  $("#progTxt").innerHTML='<b>'+t.n2+' z '+t.n+'</b> vybavené'+(t.n1?' · <b style="color:var(--wait)">'+t.n1+'</b> čaká na platbu':'');
  const toGo=diff(TRIP.from), toEnd=diff(TRIP.to);
  $("#countdown").textContent = toGo>0 ? toGo+" "+pl(toGo,"deň","dni","dní")+" do odletu"
    : toEnd>=0 ? (1-toGo)+". deň cesty" : "";
  const nx=items().filter(i=>!i.bud && !i.pack && i.st<2 && isISO(i.due)).sort(byDue)[0];
  const el=$("#next");
  if(nx){ const d=diff(nx.due);
    el.innerHTML='Najbližšie: <b>'+esc(nx.n)+'</b> · <span class="'+(d<0?"late":d<=14?"soon":"")+'">'+short(nx.due)+' ('+rel(d)+')</span>';
    el.hidden=false;
  } else el.hidden=true;
}

function renderTodo(){
  const all=items().filter(i=>!i.bud && !i.pack);
  const open=all.filter(i=>i.st<2).sort(byDue), done=all.filter(i=>i.st===2);
  const buckets=[["Po termíne",[]],["Najbližších 30 dní",[]],["Pred odletom",[]],["Počas cesty",[]],["Bez termínu",[]]];
  open.forEach(i=>{
    if(!isISO(i.due)) return buckets[4][1].push(i);
    const n=diff(i.due);
    buckets[n<0?0 : n<=30?1 : i.due<TRIP.from?2 : 3][1].push(i);
  });
  let h="";
  if(!open.length) h+='<div class="grp"><div class="rows"><div class="empty">Všetko je vybavené.</div></div></div>';
  buckets.forEach(([name,list],ix)=>{
    if(!list.length) return;
    const sum=list.reduce((a,i)=>a+eff(i),0);
    h+='<div class="grp"><div class="grpHead"><span'+(ix===0?' class="late"':'')+'>'+name+' · '+list.length+'</span>'+(sum?'<em>'+eur(sum)+'</em>':'')+'</div><div class="rows">'
      + list.map(i=>row(i,"todo")).join("") + '</div></div>';
  });
  h+='<button class="add" type="button" data-new="Vybaviť">+ Pridať položku</button>';
  if(done.length){
    h+='<details class="fold"'+(fold.done?" open":"")+' data-fold="done"><summary><span>Hotovo · '+done.length+'</span></summary><div class="rows">'
      + done.map(i=>row(i,"done")).join("") + '</div></details>';
  }
  $("#p-todo").innerHTML=h;
}

const dayOf = d => Object.assign({}, d, S.days[d.d]);
const notesOf = p => Array.isArray(S.tips[p.id]) ? S.tips[p.id] : p.tips;
function tipsAll(){
  return TIPS.filter(t=>!S.tipDel.includes(t.id)).map(t=>Object.assign({}, t, S.tip[t.id]))
    .concat(S.tipAdd.map(t=>Object.assign({}, t)));
}
const tipsAt = at => tipsAll().filter(t=>t.at===at);
function tipPatch(id,p){
  const c=S.tipAdd.find(x=>x.id===id);
  if(c) Object.assign(c,p); else S.tip[id]=Object.assign({}, S.tip[id], p);
  touch();
}
const tipPill = (at,n,label) => '<button class="pill" type="button" data-tips="'+esc(at)+'" aria-label="Rady a tipy — '+esc(label)+'">'+ICON_BULB+'<span>Tipy · '+n+'</span></button>';
function renderPlan(){

    DAYS.filter(d=>d.p===p.id).map(dayOf).forEach(d=>{
      const dt=D(d.d), cls = dt<now ? " past" : +dt===+now ? " today" : "";

      const nT=tipsAt(d.d).length;
      const chips=(nT ? tipPill(d.d, nT, short(d.d)) : "") + all.filter(i=>i.day===d.d && i.id!==p.stay).map(i=>
        '<button class="pill" type="button" data-open="'+esc(i.id)+'" data-s="'+i.st+'" aria-label="'+esc(i.n)+' — '+LBL[i.st]+'"><i></i><span>'+esc(i.k||i.n)+'</span></button>').join("");
      h+='<article class="day'+cls+'" id="d-'+d.d+'" style="--c:'+c+'">'

const fold={done:false};
function renderMeter(){
  const t=totals(), budget=num(S.budget);

  const bar=$("#mBar").children;
  bar[0].style.width=w(t.paid); bar[1].style.width=w(t.wait); bar[2].style.width=w(t.rest);

}
function renderMoney(){
  const all=items();
  let h="";
  GROUPS.forEach(g=>{
    const list=all.filter(i=>i.g===g && (g!=="Vybaviť" || num(i.est)>0));
    if(!list.length && g==="Vybaviť") return;
    const sum=list.reduce((a,i)=>a+eff(i),0);
    const allDone=list.length>0 && list.every(i=>!i.bud && i.st===2);

    h+='<details class="fold"'+(fold[g]?" open":"")+' data-fold="'+g+'"><summary><span>'+g+(allDone?' · všetko zaplatené':'')+'</span><em>'+eur(sum)+'</em></summary><div class="rows">'

document.addEventListener("click", e=>{
  const t=e.target, q=s=>t.closest(s);
  let el;
  if(t===dlg){ dlg.close(); return; }
  if(q("[data-close]")){ dlg.close(); return; }
  if(q(".lnk")) return;
  if((el=q("[data-cyc]"))){
    const i=item(el.dataset.cyc); if(!i) return;
    const next = threeState(i) ? (i.st+1)%3 : (i.st===2?0:2);
    patch(i.id,{st:next}); renderAll(); return;
  }
  if((el=q("[data-st]")) && ctx && ctx.id){ patch(ctx.id,{st:+el.dataset.st}); openItem(ctx.id); return; }
  if((el=q("[data-open]"))){ openItem(el.dataset.open); return; }
  if((el=q("[data-pview]"))){ packView=el.dataset.pview; renderPack(); return; }
  if(q("[data-newpack]")){
    const id="c"+Date.now(), buying=packView==="buy";
    S.add.push({id:id, g:"Balenie", pack:true, who:buying?"s":packView, cat:"Ostatné", n:"", buy:buying, st:0}); touch(); openItem(id,true); return;
  }
  if((el=q("[data-new]"))){
    const id="c"+Date.now();
    S.add.push({id:id, g:el.dataset.new, n:"", st:0}); touch(); openItem(id,true); return;
  }
  if((el=q("[data-del]"))){
    if(!el.classList.contains("armed")){ el.classList.add("armed"); el.textContent="Naozaj zmazať?"; return; }
    const id=el.dataset.del;
    if(S.add.some(x=>x.id===id)) S.add=S.add.filter(x=>x.id!==id);
    else { S.del.push(id); delete S.it[id]; }
    touch(); dlg.close(); return;
  }
  if((el=q("[data-day]"))){ openDay(el.dataset.day); return; }
  if(q("[data-dayreset]") && ctx && ctx.day){ delete S.days[ctx.day]; touch(); openDay(ctx.day); return; }
  if((el=q("[data-tips]"))){ openTips(el.dataset.tips); return; }
  if((el=q("[data-tipnew]"))){
    const id="t"+Date.now();
    S.tipAdd.push({id:id, at:el.dataset.tipnew, n:""}); touch(); openTipEdit(id,true); return;
  }
  if((el=q("[data-tipedit]"))){ openTipEdit(el.dataset.tipedit); return; }
  if((el=q("[data-tipdel]")) && ctx){
    if(!el.classList.contains("armed")){ el.classList.add("armed"); el.textContent="Naozaj zmazať?"; return; }
    const id=el.dataset.tipdel, at=ctx.tips;
    if(S.tipAdd.some(x=>x.id===id)) S.tipAdd=S.tipAdd.filter(x=>x.id!==id);
    else { S.tipDel.push(id); delete S.tip[id]; }
    touch(); openTips(at); return;
  }
  if(q("[data-tipsback]") && ctx){ dropEmpty(); openTips(ctx.tips); return; }
  if(q("[data-tipsedit]") && ctx){ openTips(ctx.tips,true); return; }
  if(q("[data-tipsreset]") && ctx){ delete S.tips[ctx.tips]; touch(); openTips(ctx.tips); return; }
  if(q("#next")){ showTab("todo"); return; }
  if(q("#link")){ openLink(); return; }
  if(q("#unlink")){ ls(K_TOK,null); dlg.close(); return; }
});

document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="budget"){ S.budget=num(el.value); touch(); renderMeter(); return; }
  if(el.id==="rate"){ const v=num(el.value); if(v>0){ S.rate=v; touch(); conv(); } return; }
  if(el.id==="thb"){ conv(); return; }
  if(!ctx) return;
  if(el.dataset.f && ctx.id){
    const f=el.dataset.f; let v=el.value;
    if(el.type==="checkbox"){ patch(ctx.id,{[f]:el.checked}); openItem(ctx.id); return; }
    if(f==="est") v=num(v);

    else if(f==="note") v=v.trim();
    else v=v.replace(/\s+/g," ").trim();
    patch(ctx.id,{[f]:v});
    if(f==="u"){ const a=$("#shLink"), u=normUrl(v); a.hidden=!u; a.href=u||"#"; }

  }
  if(el.dataset.df && ctx.day){
    const base=DAYS.find(d=>d.d===ctx.day), o=Object.assign({t:base.t, l:base.l, w:base.w||""}, S.days[ctx.day]);
    if(el.dataset.df==="l") o.l=el.value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{ const k=s.indexOf("|"); return k<0 ? ["",s] : [s.slice(0,k).trim(), s.slice(k+1).trim()]; });
    else o[el.dataset.df]=el.value.replace(/\s+/g," ").trim();
    S.days[ctx.day]=o; touch(); return;
  }
  if(el.dataset.tp && ctx.tipId){

    tipPatch(ctx.tipId,{[k]: k==="p"||k==="w" ? el.value.trim() : el.value.replace(/\s+/g," ").trim()}); return;
  }
  if(el.hasAttribute("data-tf") && ctx.tips){
    S.tips[ctx.tips]=el.value.split("\n").map(s=>s.trim()).filter(Boolean); touch(); return;
  }
  if(el.dataset.set==="tok"){ ls(K_TOK, el.value.trim()||null); return; }
});

/* ================= SHARED VERSION (GitHub) =================
   Every change is saved to this browser at once and, when a token is set, pushed to the shared file on the
   `data` branch — kept off `main` so a save never rebuilds the site. No token lives in this file. */
const OWNER="MilanKubackaM", REPO="thailandPlanner", BRANCH="data", PATH="checklist.json";
const API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+PATH;
const RAW="https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/"+PATH;
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a,b) => JSON.stringify(a)===JSON.stringify(b);
const b64 = str => { let o=""; new TextEncoder().encode(str).forEach(b=>{ o+=String.fromCharCode(b); }); return btoa(o); };
const unb64 = v => { const bin=atob(String(v).replace(/\s/g,"")), by=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i); return new TextDecoder().decode(by); };

// Three-way merge so two people can edit at once: a side that did not touch a value takes the other side's, a real clash keeps mine.
function merge3(base, mine, theirs){
  if(same(mine,base)) return theirs;
  if(same(theirs,base) || same(mine,theirs)) return mine;
  if(isObj(mine) && isObj(theirs)){
    const b=isObj(base)?base:{}, out={};
    new Set(Object.keys(theirs).concat(Object.keys(mine))).forEach(k=>{
      const v=merge3(b[k], mine[k], theirs[k]);
      if(v!==undefined) out[k]=v;
    });
    return out;
  }
  if(Array.isArray(mine) && Array.isArray(theirs)){
    const b=Array.isArray(base)?base:[];
    const rows=a=>a.every(x=>isObj(x) && x.id), flat=a=>a.every(x=>typeof x==="string");
    if(rows(mine) && rows(theirs)){
      const ids=[...new Set(theirs.concat(mine).map(x=>x.id))], f=(a,id)=>a.find(x=>isObj(x) && x.id===id);
      return ids.map(id=>merge3(f(b,id), f(mine,id), f(theirs,id))).filter(x=>x!==undefined);
    }
    if(flat(mine) && flat(theirs)){
      return [...new Set(theirs.concat(mine))].filter(x=>!(b.includes(x) && !(mine.includes(x) && theirs.includes(x))));
    }
  }
  return mine;
}

const net={busy:false, err:"", at:""};
let rev=0, timer=null, again=false, clashes=0, lastSync=0;
function markSync(){
  const tok=!!ls(K_TOK);
  const t = !tok ? "Zmeny sa ukladajú len do tohto prehliadača."
    : net.err ? "Neuložené pre oboch — "+net.err
    : net.busy ? "Ukladám…"
    : M.dirty ? "Čaká na uloženie…"
    : "Uložené pre oboch"+(net.at?" · "+net.at:"");
  $("#sync").textContent=t;
  $("#link").textContent = tok ? "Token" : "Zapnúť ukladanie pre oboch";
  const toast=$("#toast"); toast.hidden=!(tok && net.err); toast.textContent=t;
}
function schedule(ms){
  if(!ls(K_TOK)) return;
  clearTimeout(timer); timer=setTimeout(sync, ms===undefined ? 1200 : ms);
}
async function getShared(){
  const tok=ls(K_TOK), h={Accept:"application/vnd.github+json"};
  if(tok) h.Authorization="Bearer "+tok;
  try{
    const r=await fetch(API+"?ref="+BRANCH,{headers:h, cache:"no-store"});
    if(r.status===404) return {sha:null, doc:null};
    if(!r.ok){ const e=new Error("HTTP "+r.status); e.status=r.status; throw e; }
    const j=await r.json();
    return {sha:j.sha, doc:JSON.parse(unb64(j.content))};
  }catch(err){
    if(tok) throw err;
    // no token and the API is unavailable (rate limit): fall back to the CDN copy, which can be minutes old
    const r=await fetch(RAW+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw err;
    return {sha:null, doc:await r.json(), cdn:true};
  }
}
async function sync(){
  if(net.busy){ again=true; return; }
  net.busy=true; markSync();
  try{
    const tok=ls(K_TOK), r=await getShared();
    lastSync=Date.now();
    const valid=isObj(r.doc) && r.doc.v===2 && isObj(r.doc.state);
    if(valid && (r.cdn ? !M.base : r.sha!==M.sha)){
      const theirs=norm(r.doc.state);
      S = M.dirty ? norm(merge3(M.base||DEF(), S, theirs)) : theirs;
      M.base=clone(theirs); if(!r.cdn) M.sha=r.sha;
      if(same(S,theirs)) M.dirty=false;
      persist();
      if(!dlg.open) renderAll();
    }
    if(tok && (M.dirty || !valid)){
      const sent=clone(S), at=rev;
      const body={message:"Planner "+new Date().toISOString().slice(0,16).replace("T"," "), branch:BRANCH,
        content:b64(JSON.stringify({v:2, savedAt:new Date().toISOString(), state:sent},null,2))};
      if(r.sha) body.sha=r.sha;
      const res=await fetch(API,{method:"PUT", headers:{Authorization:"Bearer "+tok, Accept:"application/vnd.github+json", "Content-Type":"application/json"}, body:JSON.stringify(body)});
      const j=await res.json().catch(()=>({}));
      if((res.status===409 || res.status===422) && clashes<3){ clashes++; again=true; }   // someone saved in between: reload, merge, retry
      else if(!res.ok){ const e=new Error(j.message||("HTTP "+res.status)); e.status=res.status; throw e; }
      else {
        clashes=0;
        M.sha=(j.content && j.content.sha)||null; M.base=sent; M.dirty = rev!==at; persist();
        if(M.dirty) again=true;
      }
    }
    net.err=""; net.at=new Date().toLocaleTimeString("sk-SK",{hour:"2-digit",minute:"2-digit"});
  }catch(err){
    const st=err.status;
    net.err = st===401 ? "token je neplatný alebo vypršal"
      : (st===403 || st===404) ? "token nemá právo zapisovať (Contents: Read and write)"
      : st ? "chyba "+st+": "+err.message
      : "bez spojenia, skúsim znova";
    if(!st && ls(K_TOK)){ clearTimeout(timer); timer=setTimeout(sync,30000); }
  }
  net.busy=false; markSync();
  if(again){ again=false; schedule(300); }
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && Date.now()-lastSync > (ls(K_TOK) ? 20000 : 120000)) sync();
});
window.addEventListener("online", ()=>sync());

renderAll();

if(onTrip){

// one-time setup link: …/#t=<token> stores the token in this browser and drops it from the address bar
function takeSetupLink(){
  const m=location.hash.match(/^#t=(.+)$/);
  if(!m) return false;
  ls(K_TOK, decodeURIComponent(m[1]));
  history.replaceState(null,"",location.pathname+location.search);
  return true;
}
window.addEventListener("hashchange", ()=>{ if(takeSetupLink()){ net.err=""; sync(); } });
takeSetupLink();
sync();
